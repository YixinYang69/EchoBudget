{% extends "echobudget/base.html" %} {% block content %}
<div class="report_page">
  <div class="page_name">Financial Report</div>

    <table class="form_text">
      {% csrf_token %} {{form}}
    </table>
    <button class="entry_btn" type="submit" id="id_entry_button">Submit</button>
  </form>
  <div class="report_content"></div>
</div>

{% endblock %}
