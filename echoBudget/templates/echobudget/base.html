<!doctype html>
<html>
    <head>
        <meta charset="utf-8">
        <link href="../../static/echobudget/base.css" rel="stylesheet" type="text/css">
        <script src="../../static/echobudget/echobudget.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
        <link href="../../static/echobudget/docs/css/jquery-ui.min.css" rel="stylesheet">
        <script src="../../static/echobudget/docs/js/jquery-latest-slim.min.js"></script>
        <script src="../../static/echobudget/docs/js/jquery-migrate-3.1.0.min.js"></script>
        <script src="../../static/echobudget/docs/js/jquery-ui-custom.min.js"></script>
        <link href="../../static/echobudget/keyboard.css" rel="stylesheet">
        <script src="../../static/echobudget/jquery.keyboard.js"></script>

        <title>Echo Budget</title>
    </head>

    <body>
        <div class="header" id="id_header_div">
            Echo Budget
        </div>
        <section class="container">
            <div class="left-half">
                <div class="content">
                    {% block content %}
                    {% endblock %}
                </div>
                <div class="navbar">
                    <ul>
                        <li><a href="{% url 'home' %}" class="navitem{% if active == 'home' %} active{% endif %}" id="id_home" onclick="activate(this)">Home</a></li>
                        <li><a href="{% url 'entrylist' %}" class="navitem{% if active == 'record' %} active{% endif %}" id="id_record" onclick="activate(this)">Record</a></li>
                        <li><a href="{% url 'report' %}" class="navitem{% if active == 'report' %} active{% endif %}" id="id_report" onclick="activate(this)">Report</a></li>
                    </ul>
                </div>
            </div>
            <div class="vertical-line"></div>
            <div class="right-half">
                {% block speak %}
                {% endblock %}
            </div>
        <script type="text/javascript">
        </script>
    </body>
</html>
